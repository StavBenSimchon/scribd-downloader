{{- if .Values.httproute }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "scribd-downloader.fullname" . }}
  labels:
    {{- include "scribd-downloader.labels" . | nindent 4 }}
spec:
  hostnames:
    - {{ .Values.httproute.hostname }}
  parentRefs:
    - name: {{ required "httproute.parentRef.name is required" .Values.httproute.parentRef.name }}
      namespace: {{ .Values.httproute.parentRef.namespace | default "default" }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "scribd-downloader.fullname" . }}
          port: {{ .Values.service.port }}
          weight: 1
{{- end }}
