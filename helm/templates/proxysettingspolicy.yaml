{{- if and .Values.httproute .Values.httproute.backendTimeout }}
apiVersion: gateway.nginx.org/v1alpha1
kind: ProxySettingsPolicy
metadata:
  name: {{ include "scribd-downloader.fullname" . }}-timeout
  labels:
    {{- include "scribd-downloader.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "scribd-downloader.fullname" . }}
  timeout:
    read: {{ .Values.httproute.backendTimeout | quote }}
    send: {{ .Values.httproute.backendTimeout | quote }}
{{- end }}
