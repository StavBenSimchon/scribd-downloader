name: Nuke GHCR packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Comma separated container package names to delete"
        required: true
        default: "scribd-downloader"

permissions:
  contents: read
  packages: write

jobs:
  nuke:
    runs-on: ubuntu-latest
    steps:
      - name: Delete packages
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PACKAGES: ${{ inputs.packages }}
        run: |
          set -uo pipefail
          for pkg in $(echo "$PACKAGES" | tr ',' ' '); do
            for name in "$pkg" "$OWNER/$pkg"; do
              enc=$(printf '%s' "$name" | jq -sRr @uri)
              code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/users/$OWNER/packages/container/$enc")
              if [ "$code" = "204" ]; then
                echo "DELETED: $name"
                break
              else
                echo "tried $name -> HTTP $code: $(jq -r '.message // ""' /tmp/resp.json)"
              fi
            done
          done
