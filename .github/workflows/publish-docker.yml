name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "scribd-downloader.py"
      - "requirements.txt"
      - "web/**"
      - ".github/workflows/publish-docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: StavBenSimchon/github-actions/.github/actions/build-push-docker@main
        with:
          token: ${{ github.token }}
          cleanup-token: ${{ secrets.GHCR_CLEANUP_TOKEN }}
          image-name: scribd-downloader
          target: web
          keep: "3"
