<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scribd Downloader</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #181b22;
    --line: #262b36;
    --text: #e8eaf0;
    --dim: #8b93a3;
    --accent: #4f8cff;
    --ok: #2fbf71;
    --err: #e5484d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
  }
  main { width: min(720px, 94vw); padding: 32px 0 64px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .sub { color: var(--dim); margin: 0 0 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 18px;
  }
  form { display: flex; gap: 10px; }
  input[type=text] {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    padding: 12px 14px;
    font-size: 15px;
    outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    color: white;
    padding: 12px 18px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  button.ghost {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
    padding: 8px 14px;
    font-size: 13px;
    text-decoration: none;
    display: inline-block;
  }
  button.ghost:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }

  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 26px 0 10px; }

  /* spinner */
  .working { display: flex; align-items: center; gap: 18px; }
  .ring {
    width: 84px; height: 84px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0);
    position: relative;
    flex-shrink: 0;
  }
  .ring::before {
    content: "";
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    background: var(--card);
  }
  .ring span { position: relative; font-size: 18px; font-weight: 700; }
  .spin {
    width: 18px; height: 18px;
    border: 3px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: rot 0.9s linear infinite;
  }
  @keyframes rot { to { transform: rotate(360deg); } }
  .job-url { word-break: break-all; font-weight: 600; }
  .job-msg { color: var(--dim); font-size: 13px; word-break: break-all; }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 4px;
    border-top: 1px solid var(--line);
  }
  .row:first-child { border-top: 0; }
  .row .grow { flex: 1; min-width: 0; }
  .name { word-break: break-all; }
  .meta { color: var(--dim); font-size: 12px; }
  .tag {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
    padding: 3px 9px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .tag.waiting { background: #2a2f3a; color: var(--dim); }
  .tag.working { background: #1d3a6b; color: #9dc0ff; }
  .tag.done    { background: #143d29; color: var(--ok); }
  .tag.error   { background: #46202394; color: var(--err); }
  .empty { color: var(--dim); padding: 10px 4px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>📚 Scribd Downloader</h1>
  <p class="sub">Paste link → get PDF. One job at a time. Everyone sees the same queue.</p>

  <div class="card">
    <form id="form">
      <input id="url" type="text" placeholder="https://www.scribd.com/document/..." required>
      <button id="go" type="submit">DOWNLOAD</button>
    </form>
    <div id="msg" class="job-msg" style="margin-top:10px"></div>
  </div>

  <h2>Processing</h2>
  <div class="card" id="processing"><div class="empty">Nothing cooking right now.</div></div>

  <h2>Queue</h2>
  <div class="card" id="queue"><div class="empty">Queue empty.</div></div>

  <h2>Ready PDFs — click to save to your PC</h2>
  <div class="card" id="files"><div class="empty">No PDFs yet.</div></div>
</main>

<script>
const $ = (id) => document.getElementById(id);

function fmtSize(bytes) {
  if (bytes > 1e6) return (bytes / 1e6).toFixed(1) + " MB";
  return Math.max(1, Math.round(bytes / 1e3)) + " KB";
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

function renderProcessing(jobs) {
  const job = jobs.find(j => j.status === "working");
  const box = $("processing");
  if (!job) {
    box.innerHTML = '<div class="empty">Nothing cooking right now.</div>';
    return;
  }
  box.innerHTML = `
    <div class="working">
      <div class="ring" style="--p:${job.progress}"><span>${job.progress}%</span></div>
      <div class="spin"></div>
      <div class="grow">
        <div class="job-url">${esc(job.url)}</div>
        <div class="job-msg">${esc(job.message)}</div>
      </div>
    </div>`;
}

function renderQueue(jobs) {
  const list = jobs.filter(j => j.status !== "working");
  const box = $("queue");
  if (!list.length) {
    box.innerHTML = '<div class="empty">Queue empty.</div>';
    return;
  }
  box.innerHTML = list.map(j => `
    <div class="row">
      <div class="grow">
        <div class="name">${esc(j.url)}</div>
        <div class="meta">${j.file ? esc(j.file) : ""}${j.error ? esc(j.error) : ""}</div>
      </div>
      <span class="tag ${j.status}">${j.status}</span>
    </div>`).join("");
}

function renderFiles(files) {
  const box = $("files");
  if (!files.length) {
    box.innerHTML = '<div class="empty">No PDFs yet.</div>';
    return;
  }
  box.innerHTML = files.map(f => `
    <div class="row">
      <div class="grow">
        <div class="name">📄 ${esc(f.name)}</div>
        <div class="meta">${fmtSize(f.size)} · ${new Date(f.modified * 1000).toLocaleString()}</div>
      </div>
      <a class="ghost" href="/api/files/${encodeURIComponent(f.name)}">SAVE TO PC</a>
    </div>`).join("");
}

async function refresh() {
  try {
    const [jobs, files] = await Promise.all([
      fetch("/api/jobs").then(r => r.json()),
      fetch("/api/files").then(r => r.json()),
    ]);
    renderProcessing(jobs);
    renderQueue(jobs);
    renderFiles(files);
  } catch (e) { /* server blink, try again next tick */ }
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const url = $("url").value.trim();
  if (!url) return;
  $("go").disabled = true;
  try {
    const res = await fetch("/api/jobs", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      $("msg").textContent = body.detail || "Something went wrong";
    } else {
      $("msg").textContent = "Added to queue!";
      $("url").value = "";
    }
  } catch (e) {
    $("msg").textContent = "Server not answering";
  }
  $("go").disabled = false;
  refresh();
});

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
